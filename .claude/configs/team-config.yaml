task:
  name: "sample-research-and-report"
  description: "Perform a structured research analysis and produce a final report."
  input_description: "사용자가 제공한 업무 설명과 참고 자료를 바탕으로 리서치, 분석, 최종 보고서를 작성합니다."
  final_output:
    format: "md"
    description: "최종 통합 보고서"

  # 팀장이 사용자 요청 문장에서 자동 판별할 task 유형.
  # 아래 trigger 키워드가 포함되면 해당 type 으로 분기.
  # 매칭이 없으면 default 사용.
  types:
    - name: "research-report"
      default: true
      members: ["member-alpha", "member-beta", "member-gamma", "member-delta"]
      triggers: ["리서치", "분석", "보고서", "시장", "현황", "research", "report"]
      description: "리서치/분석 보고서. alpha 조사 → gamma 팩트체크 → delta 시각화 → beta 보고서 작성."
    - name: "code-review"
      members: ["member-alpha", "member-gamma", "member-beta"]
      triggers: ["코드 리뷰", "PR", "풀리퀘", "code review", "리뷰해"]
      description: "코드/PR 리뷰. alpha 가 코드 스캔, gamma 가 논리·보안 검증, beta 가 리뷰 요약."
    - name: "multilingual-brief"
      members: ["member-alpha", "member-beta", "member-delta"]
      triggers: ["영문", "번역", "다국어", "english", "translate", "브리프"]
      description: "다국어 브리프. alpha 조사 → beta 다국어 요약·번역 → delta 시각자료(비교 테이블·레이아웃)."
    - name: "dev"
      members: ["member-eta", "member-alpha", "member-epsilon"]
      triggers: ["개발", "코드", "배포", "수정", "버그", "기능 추가", "implement", "deploy", "fix", "refactor"]
      description: "리서치 → 코드 수정 → 자체 검증 → 배포 워크플로우. alpha 가 구현 방향 분석, epsilon 이 코드 수정·검증·배포 실행."
      deployment:
        enabled: true
        skill: "deploy-heal"
        max_attempts: 3
        staging_port_offset: 1000
        health_check_timeout_sec: 30
        health_check_retries: 3
        health_check_interval_sec: 10
        rollback_on_failure: true
        commit_on_success: true
    - name: "design"
      members: ["member-alpha", "member-zeta"]
      triggers: ["설계", "설계서", "아키텍처", "시스템 설계", "에이전트 설계", "design", "spec", "blueprint"]
      description: "에이전트 설계서 작성. alpha 가 사전 리서치·현황 분석, zeta 가 인터뷰 후 통합 설계서(design-spec.md) 작성."
    - name: "github-plan"
      members: ["member-eta", "member-alpha", "member-beta"]
      triggers: ["깃허브", "오픈소스 참고", "github", "공개 코드", "레퍼런스 찾아", "비슷한 구현", "코드 학습"]
      description: "GitHub 공개 코드 탐색 → 패턴 분석 → 구현 계획 수립. eta 가 레포 탐색·라이선스 감사, alpha 가 구현 방향 분석, beta 가 계획 보고서 작성."
      default: false
    - name: "ir-relations"
      members: ["member-gamma", "member-alpha", "member-delta", "member-beta"]
      triggers: ["IR", "실적발표", "주주총회", "주총", "의결권", "애널리스트", "투자자", "주주", "밸류에이션"]
      description: "IR(투자자관계) 대응. gamma 가 실적·주주 데이터 원문 수집 → alpha 가 재무 분석 → delta 가 IR 자료 시각화 → beta 가 설명자료·Q&A 작성."
      require_human_approval: true
    - name: "gr-policy"
      members: ["member-theta", "member-alpha", "member-beta"]
      triggers: ["GR", "규제", "입법", "국회", "대관", "정책 대응", "정책 건의", "정부 부처", "로비"]
      description: "GR(정책·규제 대응). theta 가 정책·입법 동향 모니터링 및 영향도 분석 → alpha 가 대응전략 분석 → beta 가 정책 건의서·답변서 작성."
      require_human_approval: true
    - name: "pr-crisis"
      members: ["member-iota", "member-beta", "member-gamma"]
      triggers: ["PR", "보도자료", "언론", "미디어", "위기관리", "위기 대응", "브랜드 캠페인", "평판", "기자간담회"]
      description: "PR(홍보·위기관리). iota 가 언론·SNS 모니터링 및 위기 단계 판정 → beta 가 보도자료·해명자료 작성 → gamma 가 사실관계 최종 검증."
      require_human_approval: true
    - name: "mgmt-planning"
      members: ["member-alpha", "member-delta", "member-beta"]
      triggers: ["경영계획", "경영기획", "예산", "이사회", "KPI", "경영 실적", "경영 목표", "경영평가"]
      description: "경영기획·사업계획 관리. alpha 가 경영실적·예산 분석 → delta 가 KPI·이사회 자료 표 작성 → beta 가 경영보고서 작성."
    - name: "strategy-newbiz"
      members: ["member-gamma", "member-alpha", "member-delta", "member-beta"]
      triggers: ["신사업", "M&A", "인수합병", "타당성조사", "포트폴리오", "전략적 제휴", "벤치마킹", "Feasibility"]
      description: "전략·신사업 추진(M&A 포함). gamma 가 경쟁사·시장 동향 원문 수집 → alpha 가 타당성·포트폴리오 분석 → delta 가 비교 시각화 → beta 가 전략보고서 작성."

  # 풀 파이프라인(위 types, Phase 1~6) 없이 Team Lead가 직접 연동 데이터소스를 조회해 답하는
  # 경량 경로. slack-bridge/app.py 는 이 triggers 로 "반응할지"만 싸게 1차 필터링하고, 실제로
  # quick_query 로 처리할지 위 types(풀 리포트)로 처리할지는 CLAUDE.md Phase 0 에서 Team Lead가
  # report_signal_triggers 와 비교해 최종 판단한다 (애매하면 인터랙티브 승인 버튼으로 사용자에게 확인).
  quick_query:
    enabled: true
    triggers:
      # 조회 의도 동사/표현
      - "조회"
      - "확인해줘"
      - "확인 해줘"
      - "얼마"
      - "몇 건"
      - "몇 개"
      - "언제"
      - "알려줘"
      - "찾아줘"
      - "현재"
      - "상태"
      # 연동 데이터소스 이름 (external_data_sources.dashboards / dept_notion 과 동기화)
      - "ERP"
      - "손익"
      - "실적"
      - "현장"
      - "대시보드"
      - "AX"
      - "마켓 인텔리전스"
      - "노션"
      - "Notion"
    # 이 키워드가 함께 매칭되면 quick_query 보다 풀 리포트(task.types) 쪽 신호로 우선한다 —
    # Phase 0 판별 시 Team Lead 가 참조.
    report_signal_triggers: ["분석", "보고서", "리서치", "전략", "계획", "설계", "검토 의견", "타당성"]
    skills:
      - dept-dashboard-reader
      - dept-notion-reader
      - sql-reader
      - shared/web-research
    log_file: "quick-query-log.md"

team:
  lead:
    name: "team-lead"
    role: "팀장 겸 리뷰어"
    direct_edit_threshold: "20%"
    skills:
      - task-planner
      - artifact-reviewer
      - integrator
      - fewer-permission-prompts

  members:
    - name: "member-alpha"
      role: "시장 조사 및 데이터 분석 담당"
      domain: "market research"
      agent_md: ".claude/agents/member-alpha(조사)/AGENT.md"
      skills:
        - shared/file-io
        - shared/data-parser
        - dept-notion-reader
        - dept-dashboard-reader
        - sql-reader
      output:
        directory: "member-alpha"
        expected_files:
          - name: "analysis-report.md"
            format: "md"
            required_sections:
              - "개요"
              - "분석 결과"
              - "결론"

    - name: "member-beta"
      role: "최종 보고서 초안 작성 담당"
      domain: "report writing"
      agent_md: ".claude/agents/member-beta(보고서)/AGENT.md"
      skills:
        - shared/file-io
      output:
        directory: "member-beta"
        expected_files:
          - name: "draft-report.md"
            format: "md"
            required_sections:
              - "요약"
              - "핵심 인사이트"
              - "추천 사항"

    - name: "member-gamma"
      role: "팩트체커 (인용·수치·출처 검증)"
      domain: "fact checking"
      agent_md: ".claude/agents/member-gamma(팩트체크)/AGENT.md"
      skills:
        - shared/file-io
        - shared/web-research   # WebSearch · WebFetch 사용
      output:
        directory: "member-gamma"
        expected_files:
          - name: "fact-check-log.md"
            format: "md"
            required_sections:
              - "검증 요약"
              - "항목별 검증 결과"
              - "수정 권고"

    - name: "member-delta"
      role: "시각화 담당 (Mermaid/테이블/차트 스펙)"
      domain: "visualization"
      agent_md: ".claude/agents/member-delta(시각화)/AGENT.md"
      skills:
        - shared/file-io
      output:
        directory: "member-delta"
        expected_files:
          - name: "visuals.md"
            format: "md"
            required_sections:
              - "시각자료 개요"
              - "Mermaid 다이어그램"
              - "핵심 수치 테이블"

    - name: "member-epsilon"
      role: "개발 태스크 실행 담당 (코드 수정·검증·배포)"
      domain: "software development"
      agent_md: ".claude/agents/member-epsilon(개발)/AGENT.md"
      skills:
        - deploy-heal
        - shared/file-io
      output:
        directory: "member-epsilon"
        expected_files:
          - name: "dev-log.md"
            format: "md"
            required_sections:
              - "변경 파일 목록"
              - "자체 검증 결과"
              - "배포 결과"
          - name: "diff-summary.md"
            format: "md"

    - name: "member-zeta"
      role: "개발 설계 담당 (에이전트 설계서 작성)"
      domain: "system design"
      agent_md: ".claude/agents/member-zeta(설계)/AGENT.md"
      skills:
        - shared/file-io
      output:
        directory: "member-zeta"
        expected_files:
          - name: "design-spec.md"
            format: "md"
            required_sections:
              - "작업 컨텍스트"
              - "워크플로우 정의"
              - "구현 스펙"

    - name: "member-eta"
      role: "GitHub 공개 레포 탐색·코드 패턴 분석·라이선스 감사 담당"
      domain: "github research"
      agent_md: ".claude/agents/member-eta(OSS리서치)/AGENT.md"
      skills:
        - github-researcher
        - shared/file-io
      output:
        directory: "member-eta"
        expected_files:
          - name: "github-research-report.md"
            format: "md"
            required_sections:
              - "탐색 조건"
              - "탐색 결과 요약"
              - "레포별 상세 분석"
              - "크로스 레포 공통 패턴"
              - "안티패턴"
              - "Planner를 위한 권고 스택·접근법"
              - "출처 목록"

    - name: "member-theta"
      role: "GR 정책·규제 동향 모니터링 및 영향도 분석 담당"
      domain: "government relations / policy research"
      agent_md: ".claude/agents/member-theta(정책리서치)/AGENT.md"
      skills:
        - policy-researcher
        - shared/web-research
        - shared/file-io
      output:
        directory: "member-theta"
        expected_files:
          - name: "gr-policy-report.md"
            format: "md"
            required_sections:
              - "모니터링 조건"
              - "정책·입법 동향 요약"
              - "영향도 분석"
              - "대응 방안 및 건의사항"
              - "출처 목록"

    - name: "member-iota"
      role: "PR 언론·SNS 모니터링 및 위기 단계 판정 담당"
      domain: "media relations / crisis monitoring"
      agent_md: ".claude/agents/member-iota(PR모니터링)/AGENT.md"
      skills:
        - crisis-comms
        - shared/web-research
        - shared/file-io
      output:
        directory: "member-iota"
        expected_files:
          - name: "media-monitoring-log.md"
            format: "md"
            required_sections:
              - "모니터링 요약"
              - "이슈·위기 단계 판정"
              - "쟁점별 상세"
              - "대응 권고"

termination:
  max_cycles: 3
  max_review_per_member: 2
  quality_criteria:
    # "rule"/"schema" 는 scripts/validate_artifact.py 로 결정론적으로 강제된다 (CLAUDE.md Phase 3-0/4).
    # "isolated_review" 는 scripts/review_artifact.py(격리된 서브프로세스)로 강제된다 (CLAUDE.md Phase 4).
    # "llm_self_check" 만 팀장 LLM이 직접 판단한다 — 범위는 여러 산출물을 모두 본 사람만 가능한
    # 부분(정합성·중복/모순)으로 한정한다. 개별 섹션 깊이는 isolated_review가 담당.
    - type: "rule"
      description: "모든 Member 산출물의 필수 섹션 포함"
    - type: "isolated_review"
      description: "최종 통합 산출물을 member-reviewer 기준(task type별 깊이/인사이트 rubric)으로 독립 검토 — 근거 없는 인사이트, 일반론적 추천, 통합 중 섹션 임의 병합·개명을 걸러낸다"
    - type: "llm_self_check"
      description: "통합 산출물 여러 섹션 간 논리적 정합성 및 중복/모순 없음"
    - type: "schema"
      description: "최종 산출물이 기대 형식을 준수"
  human_approval: false
  auto_proceed_on_escalation: true
  # 실제 외부(투자자·정부·언론)로 나갈 수 있는 고위험 task type — 전역 human_approval 설정과
  # 무관하게 승인을 강제한다. 처리 로직은 CLAUDE.md "경영전략실 고위험 task type 특별 처리 규칙" 참조.
  high_risk_task_types: ["ir-relations", "gr-policy", "pr-crisis"]
  # task type 과 무관하게, 이번 사이클에서 scripts/dashboard_fetch.py(사내 부서 대시보드:
  # ERP·현장·인사·AX·브랜드·법무)를 실제로 사용했다면 human_approval 을 강제한다. 민감한 내부
  # 데이터(재무·인사 등)가 포함된 산출물은 task type 분류와 무관하게 항상 사람 승인을 거치도록
  # 하기 위함. 처리 로직은 CLAUDE.md "사내 대시보드 데이터 사용 시 승인 규칙" 참조.
  high_risk_if_dashboard_used: true
  # 위 두 조건(high_risk_task_types / high_risk_if_dashboard_used)이 실제로 Phase 5 를 보류시킬지
  # 여부의 마스터 스위치. 현재 false 인 이유: distribution 에 켜진 엔드포인트가 Notion(override 예외)·
  # Slack 뿐인데, override 로 보류되는 Slack 알림 자체에 이미 Notion 링크가 포함돼 있어 내용 노출은
  # 못 막고 "정식 완료 메시지 포맷"만 늦추는 실효성 없는 게이트였음 (2026-07-31 판단). gmail/drive/
  # calendar 등 진짜 외부向 엔드포인트가 하나라도 enabled: true 가 되면 다시 true 로 되돌릴 것.
  high_risk_override_enabled: false

execution:
  dependency_strategy: "lead_decides"
  data_passing: "file_based"
  intermediate_output_dir: "output"
  workspace:
    enabled: true
    root: "output"
    active_pointer: "output/.active-workspace"
    new_topic_trigger: "새 작업"
    slug_style: "kebab-case"
  auto_mode:
    enabled: true
    trigger_prefix: "[AUTO:"
    interrupt_policy: "none"
    escalation_channel: "slack"
    escalation_method: "stdout"  # slack-bridge agent_runner가 stdout을 읽어 Slack 스레드에 중계
    review_direct_edit_threshold: 30
    auto_log_file: "auto-log.md"

  # 사람 승인이 필요한 지점(AUTO 모드 human_approval 게이트, Phase 1-2 plan 확정, Phase 6-3 신규
  # 에이전트 제안 등)에서 공통으로 쓰는 Slack 인터랙티브 버튼 프리미티브. CLAUDE.md "인터랙티브
  # 승인(Slack 버튼)" 절 참조.
  interactive_approval:
    enabled: true
    script: "scripts/slack_approval.py"
    default_timeout_sec: 1800
    # 타임아웃(응답 없음) 시 처리 — "hold" = 기존처럼 승인 대기 상태로 남기고 사람이 세션을 열어
    # 수동으로 이어가야 함 (안전 기본값, 자동 진행하지 않음).
    fallback_on_timeout: "hold"

environment:
  SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN}"
  SLACK_REPORT_CHANNEL: "${SLACK_REPORT_CHANNEL:-#oc-agent-log}"
  PROD_PORT: "${PROD_PORT:-8000}"
  DEPT_NOTION_API_TOKEN: "${DEPT_NOTION_API_TOKEN}"
  ERP_API_KEY: "${ERP_API_KEY}"

# 다른 부서가 만든 외부 데이터소스(조회 전용)에 대한 설정. member-alpha 가
# scripts/notion_fetch.py · scripts/dashboard_fetch.py 를 통해 읽기 전용으로 접근한다.
# 실행: .claude/skills/dept-notion-reader/SKILL.md, .claude/skills/dept-dashboard-reader/SKILL.md 참조.
external_data_sources:
  dept_notion:
    enabled: true
    token_env: "DEPT_NOTION_API_TOKEN"
  # 사내 부서별 손익/실적 대시보드 API. 하나의 범용 스크립트(scripts/dashboard_fetch.py)로 호출하고,
  # base_url/key_env/엔드포인트 상세는 .claude/skills/dept-dashboard-reader/SKILL.md 의 레지스트리
  # 표에서 관리한다(스크립트 코드 변경 없이 표에 행만 추가하면 새 대시보드 확장 가능).
  # owner/last_verified: 이 스펙을 확인해 준 담당자와 확인 시점. Phase 6-1이 90일 이상 지난 항목을
  # 재확인 대상으로 플래그한다(CLAUDE.md "Phase 6: Team Capability Retrospective" 참조).
  dashboards:
    erp:
      enabled: true
      base_url: "http://10.10.190.25:8000"
      key_env: "ERP_API_KEY"
      owner: "team-lead"
      last_verified: "2026-08-06"
      note: "전사 손익/실적 — 민감 재무 데이터. Phase 5 외부 배포 전 Team Lead가 민감도 재확인"
    field:   # 현장
      enabled: true
      base_url: "https://crm.ax.barogo.io"
      key_env: "FIELD_API_KEY"
      owner: "team-lead"
      last_verified: "2026-08-06"
      note: "바로고 현장 종합 대시보드(바모딜=바로고·모아라인·딜버 배송 실적 집계). date+ym 필수, sido 선택(지역 필터). 응답 sensitivity=general"
    hr:      # 인사
      enabled: false
      owner: null
      last_verified: null
      note: "스펙 확인 필요 — 개인정보 포함 가능성, 접근 범위 별도 검토 필요"
    ax:
      enabled: true
      base_url: "https://10.10.70.81:8011"
      key_env: "AX_API_KEY"
      ca_cert: "certs/ax_server.pem"   # 자가서명 인증서 — dashboard_fetch.py --ca-cert 로 핀 고정
      owner: "team-lead"
      last_verified: "2026-08-06"
      note: "AX 사례(cases)/부서 보고서(reports) 데이터. 키 scope(cases/reports)에 따라 403 가능 — 이 키는 둘 다 확인됨. dept 파라미터는 부서 ID(한글 부서명) 기준, 'finance' 같은 영문 코드 아님"
    market:  # 마켓 인텔리전스
      enabled: true
      base_url: "https://barogo-intel.vercel.app"
      key_env: "MARKET_API_KEY"
      owner: "team-lead"
      last_verified: "2026-08-06"
      note: "주간 시장 인텔리전스 브리핑/아카이브 검색/키워드. 공개 Vercel 호스팅, 현재 서버측 인증 미구현(추후 X-API-Key 추가 예정) — 우리 쪽은 이미 헤더를 보내므로 추가되어도 클라이언트 변경 불필요"
    brand:   # 브랜드
      enabled: false
      owner: null
      last_verified: null
      note: "스펙 확인 필요"
    legal:   # 법무
      enabled: false
      owner: null
      last_verified: null
      note: "스펙 확인 필요 — 민감도 특히 높음, 접근 승인 절차 별도 검토 필요"
  # 자유 SELECT 쿼리를 허용하는 별도 DB 게이트웨이가 실제로 필요해지면 여기에 sql_gateway 항목을
  # 다시 추가하고 scripts/sql_read.py(스텁: scripts/sql_guard.py)를 구현한다. 현재는 미사용.

# Phase 5: Distribution (배포) 단계가 사용할 외부 시스템 설정.
# Phase 5 는 human_approval 통과 후 team-lead 가 실행.
# 실행: CLAUDE.md Phase 5 참조. MCP 도구가 없는 실행 환경(opencode 서브프로세스 등)에서는
# scripts/slack_publish.py · scripts/notion_publish.py 폴백을 사용한다.
distribution:
  # Slack 으로 결과물 링크 전송 (개발 요청용)
  # 실행: scripts/slack_publish.py --channel "{channel}" --blocks-file "WS/slack-notification.json"
  # 필요 조건: 봇이 이 채널의 멤버여야 함 (스크립트가 자동 join 시도, 실패 시 /invite 안내 반환)
  slack:
    enabled: true
    channel: "${SLACK_REPORT_CHANNEL:-#oc-agent-log}"
    # md 파일 다운로드 링크는 완료 메시지에서 제외. 텍스트 지시만으로는 Team Lead가 반복해서 이
    # 값을 무시했으므로(예: output/이번-전사-경영-실적-손익, output/배달대행사-pg사-이슈), 이제
    # scripts/slack_publish.py 와 slack-bridge/app.py 가 발송 직전 결정론적으로 한 번 더 걸러낸다
    # (CLAUDE.md Phase 5-2 참조) — 이 값을 true 로 바꿔도 slack_publish.py 호출 시
    # --allow-download-link 를 함께 넘기지 않으면 계속 제거된다.
    include_download_link: false
    # 다운로드 링크 접두사 (include_download_link: true 로 되돌릴 경우에만 사용)
    download_link_prefix: "https://agent-team.barogo.local/output/"

  # Notion 저장 위치 (리서치/분석 BOT DB)
  # 실행: notion-create-pages MCP 도구 우선, 없으면 scripts/notion_publish.py 폴백.
  # 폴백 사용 시 환경변수 NOTION_API_TOKEN 필요 (slack-bridge/.env.example 참조).
  notion:
    enabled: true
    database_url: "https://www.notion.so/barogohq/348363ae08db802cb0d6e5316d0eaabc"
    data_source_id: "348363ae-08db-80aa-ba4a-000b3160d6ed"
    title_property: "이름"
    icon: "🖥️"

  # Gmail / Drive / Calendar 는 실제 사용 시점에 인증 후 활성화
  gmail:
    enabled: false
  google_drive:
    enabled: false
  google_calendar:
    enabled: false
